id = "shepy.agents"
name = "Shepy Agents"
version = "0.5.0"
min_herdr_version = "0.7.0"
description = "Read compact Herdr agent history through Shepy."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "agent-list"
title = "Show Shepy agents"
contexts = ["workspace"]
command = ["node", "index.mjs", "agent-list"]

[[panes]]
id = "agents"
title = "Shepy Agents"
placement = "split"
command = ["node", "index.mjs", "agents"]
